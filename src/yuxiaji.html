<script>
/* 玉匣记通书 · 本地版
   历法内核取自已验证的协纪黄历引擎（仅用其历法部分）；
   吉凶体系全部改依《玉匣记》。 */
(function () {
  'use strict';
  var C = window.CAL, D = window.YXJ;

  /* ---------------- 基础 ---------------- */
  var SU_SEQ = ['角','亢','氐','房','心','尾','箕','斗','牛','女','虚','危','室','壁',
                '奎','娄','胃','昴','毕','觜','参','井','鬼','柳','星','张','翼','轸'];
  var QI = ['虚','奎','毕','鬼','翼','氐','箕'];
  var GAN = C.GAN, ZHI = C.ZHI, ANI = C.ANIMALS;
  var LUNAR_M = ['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  var DAY_1 = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十'];
  var DAY_2 = ['十一','十二','十三','十四','十五','十六','十七','十八','十九','二十'];
  var DAY_3 = ['廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
  var WEEK = ['日','一','二','三','四','五','六'];
  var BASE = C.gregorianToJDN(1949, 10, 1);   // 甲子日

  /* 建除吉凶（依《玉匣记》十二建星：平、成、开、危最吉；定、除次吉；破大凶） */
  var JC_LEVEL = { '建': 0, '除': -1, '满': 1, '平': -1, '定': -1, '执': 1,
                   '破': 2, '危': -1, '成': -1, '收': 0, '开': -1, '闭': 1 };
  var JC_TXT = { 0: '平', '-1': '吉', 1: '凶', 2: '大凶' };
  /* 断语用词依本书原文：平、成、开、危最吉；定、除次吉；破大凶 */
  var JC_WORD = { '建': '可吉可凶', '除': '次吉', '满': '凶', '平': '最吉', '定': '次吉',
                  '执': '凶', '破': '大凶', '危': '最吉', '成': '最吉', '收': '小吉',
                  '开': '最吉', '闭': '凶' };
  /* 黄黑道：建满平收黑，除危定执黄，成开皆可用，闭破不相当 */
  var HUANG = { '除': 1, '危': 1, '定': 1, '执': 1, '成': 1, '开': 1 };
  /* 本书两说不一：十二建星吉凶与黄黑道口诀互相矛盾者 */
  var CONTRA = { '平': '本书两说不一：十二建星称平日「大吉」，黄黑道口诀却列为黑道。',
                 '执': '本书两说不一：十二建星称执日「凶」，黄黑道口诀却列为黄道。',
                 '收': '本书两说不一：十二建星称收日「小吉」，黄黑道口诀却列为黑道。' };

  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function jdnOf(y, m, d) { return C.gregorianToJDN(y, m, d); }

  function lunarDayName(n) {
    if (n <= 10) return DAY_1[n - 1];
    if (n <= 20) return DAY_2[n - 11];
    return DAY_3[n - 21];
  }
  function lunarText(L) { return (L.leap ? '闰' : '') + LUNAR_M[L.month - 1] + lunarDayName(L.day); }
  function gzText(i) { return GAN[((i % 10) + 10) % 10] + ZHI[((i % 12) + 12) % 12]; }

  /* 二十八宿值日：七元起宿 虚奎毕鬼翼氐箕，锚 1949-10-01（甲子）；已用 7 个外部日期校验 */
  function suOf(jdn) {
    var n = jdn - BASE;
    var yuan = ((Math.floor(n / 60) - 2) % 7 + 7) % 7;
    var off = ((n % 60) + 60) % 60;
    var idx = (SU_SEQ.indexOf(QI[yuan]) + off) % 28;
    return D.su[idx];
  }

  function shaDir(z) {                       // 三合煞方：水南 木西 火北 金东
    if ([8, 0, 4].indexOf(z) >= 0) return '南';
    if ([2, 6, 10].indexOf(z) >= 0) return '北';
    if ([11, 3, 7].indexOf(z) >= 0) return '西';
    return '东';
  }

  /* ---------------- 忌日判定 ---------------- */
  function checks(jdn, L, dgz, mBranch, yGZ) {
    var out = [], d = L.day, m = L.month, g = gzText(dgz), z = dgz % 12, gan = dgz % 10;
    var t = C.termInfo(jdn);

    /* 杨公忌 */
    var yg = D.yanggong.days.some(function (x) { return x[0] === m && x[1] === d; });
    out.push({ k: '杨公忌', hit: yg, w: 3, d: yg ? '百事忌（民俗忌日，《协纪辨方书》不用此说）' : '' });

    /* 月忌 */
    var yj = D.yueji.days.indexOf(d) >= 0;
    out.push({ k: '月忌日', hit: yj, w: 2, d: yj ? '百事忌（民俗忌日，《协纪辨方书》不用此说）' : '' });

    /* 四离四绝：次日为二分二至（四离）或四立（四绝） */
    var next = t.nextIdx, isLi = false, isJue = false;
    if (t.nextJdn === jdn + 1) {
      if ([3, 9, 15, 21].indexOf(next) >= 0) isLi = true;
      if ([0, 6, 12, 18].indexOf(next) >= 0) isJue = true;
    }
    out.push({ k: '四离日', hit: isLi, w: 2, d: isLi ? '次日' + t.nextName : '' });
    out.push({ k: '四绝日', hit: isJue, w: 2, d: isJue ? '次日' + t.nextName : '' });

    /* 十恶大败 */
    var grp = null, yg10 = ((yGZ % 10) + 10) % 10;
    if (yg10 === 0 || yg10 === 5) grp = '甲己';
    else if (yg10 === 1 || yg10 === 6) grp = '乙庚';
    else if (yg10 === 2 || yg10 === 7) grp = '丙辛';
    else if (yg10 === 4 || yg10 === 9) grp = '戊癸';
    else grp = '丁壬';
    var shi = false;
    (D.shishie.year[grp] || []).forEach(function (x) {
      if (mBranch === (x[0] + 1) % 12 && g === x[1]) shi = true;
    });
    /* 十恶大败：本节标题即「十恶大败日」，标题下第一行注「百事忌」；附歌诀自问
       「何谓十恶大败？乃十干无禄」，是十日即十恶大败本身，非另有别物。
       年干表所列诸日尽在十位之内，只是「某年某月犯」的细化，故二表合为一项，
       十日皆判百事忌，不重复计罚；年干与月建相合者，另注出处。 */
    var shi10 = D.shishie.ten.indexOf(g) >= 0;
    var why = shi ? (grp + '年' + ZHI[mBranch] + '月·年干大败') : '十干无禄';
    out.push({ k: '十恶大败', hit: shi10, w: 2, d: shi10 ? why + '，百事忌' : '' });

    /* 四不详 */
    var sb = D.sishu.days.indexOf(d) >= 0;
    out.push({ k: '四不详', hit: sb, w: 1, d: sb ? '忌上官赴任' : '' });

    /* 长短星 */
    var cd = (D.changduan.t[String(m)] || []).indexOf(d) >= 0;
    out.push({ k: '长短星', hit: cd, w: 1, d: cd ? '忌裁衣纳财' : '' });

    /* 探病忌日 */
    var tb = D.tanbing.gz.indexOf(g) >= 0;
    out.push({ k: '探病忌', hit: tb, w: 1, d: tb ? '忌探病' : '' });

    /* 神号鬼哭 */
    var sh = (D.shihao.m[m - 1] || []).indexOf(z) >= 0;
    var gk = (D.guiku.m[m - 1] || []).indexOf(z) >= 0;
    out.push({ k: '神号日', hit: sh, w: 1, d: sh ? '忌下药' : '' });
    out.push({ k: '鬼哭日', hit: gk, w: 1, d: gk ? '忌下药' : '' });

    return out;
  }

  /* ---------------- 日详情 ---------------- */
  function buildDay(y, m, d) {
    var jdn = jdnOf(y, m, d);
    var L = C.toLunar(jdn), dgz = C.dayGZ(jdn), mgz = C.monthGZ(jdn), ygz = C.yearGZ(jdn);
    var jc = C.JIANCHU[C.jianchuIndex(dgz % 12, mgz.branch)];
    var su = suOf(jdn);
    var huang = !!HUANG[jc];
    var jl = JC_LEVEL[jc];
    var cks = checks(jdn, L, dgz, mgz.branch, ygz);
    /* 只计「百事忌」与整日大忌（w>=2）；四不详、长短星、探病、神号鬼哭属单项忌讳，不改总评 */
    var penalty = 0;
    cks.forEach(function (c) { if (c.hit && c.w >= 2) penalty += c.w; });

    /* 综合：宿 + 建除 + 黄黑 + 忌日 */
    var score = jl + (su.jx === '吉' ? -1 : 1) + (huang ? -1 : 1) + Math.min(penalty, 4);
    var grade, cls;
    if (score <= -2) { grade = '大吉'; cls = 'g'; }
    else if (score <= 0) { grade = '吉'; cls = 'g'; }
    else if (score <= 1) { grade = '平'; cls = 'p'; }
    else if (score <= 3) { grade = '小凶'; cls = 'b'; }
    else { grade = '大凶'; cls = 'b'; }

    /* 百事忌：杨公忌、月忌、十恶大败——本书明标「百事忌」，不因他吉而减 */
    var bai = cks.some(function (c) {
      return c.hit && (c.k === '杨公忌' || c.k === '月忌日' || c.k === '十恶大败');
    });
    if (bai) { grade = '大凶'; cls = 'b'; }

    var g = gzText(dgz);
    var m60 = D.m60[g] || { l: 0, t: '（底本无此日条目）' };

    return {
      y: y, m: m, d: d, jdn: jdn, L: L, dgz: dgz, g: g, mgz: mgz, ygz: ygz,
      year: gzText(ygz), month: gzText(mgz.index), jc: jc, su: su, huang: huang,
      jl: jl, checks: cks, grade: grade, cls: cls, score: score, m60: m60, bai: bai,
      term: C.termInfo(jdn)
    };
  }

  /* ---------------- 渲染工具 ---------------- */
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  };

  /* ---------------- 状态 ---------------- */
  var now = new Date();
  var S = {
    y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate(),
    tab: 'day', thing: D.zeri['入宅移居'] ? '入宅移居' : Object.keys(D.zeri)[0], range: 180, strict: 1, hits: null,
    suOpen: null,
    bz: { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate(), hour: 6, male: 1, lon: '' }
  };

  /* ---------------- 黄历页 ---------------- */
  function viewDay() {
    var r = buildDay(S.y, S.m, S.d);
    var isToday = (S.y === now.getFullYear() && S.m === now.getMonth() + 1 && S.d === now.getDate());
    var hits = r.checks.filter(function (c) { return c.hit; });

    var h = '';
    h += '<div class="datebar">' +
      '<button class="nav" data-act="prev">‹</button>' +
      '<div class="pick">' + r.y + '年' + r.m + '月' + r.d + '日 周' + WEEK[new Date(r.y, r.m - 1, r.d).getDay()] +
      '<input type="date" id="dpick" value="' + r.y + '-' + pad(r.m) + '-' + pad(r.d) + '"></div>' +
      '<button class="nav" data-act="next">›</button></div>';

    h += '<div class="hero"><div class="lunar-big serif' + (lunarText(r.L).length >= 5 ? ' sm' : '') + '">' +
      lunarText(r.L) + '</div>' +
      '<div class="gz-line">' + r.year + '年<i>·</i>' + r.month + '月<i>·</i>' + r.g + '日<i>·</i>属' + ANI[r.dgz % 12] + '</div>' +
      '<div class="tags">' +
      '<span class="tag">' + r.jc + '日</span>' +
      '<span class="tag ' + (r.huang ? 'green' : 'red') + '" title="依玉匣记建除口诀，非协纪青龙明堂值神">建除' + (r.huang ? '黄道' : '黑道') + '</span>' +
      '<span class="tag ' + (r.su.jx === '吉' ? 'green' : 'red') + '">' + r.su.name + '·' + r.su.jx + '</span>' +
      '<span class="tag grey">冲' + ANI[(r.dgz % 12 + 6) % 12] + ' 煞' + shaDir(r.dgz % 12) + '</span>' +
      (isToday ? '<span class="tag grey">今日</span>' : '') +
      '</div></div>';

    /* 断日 */
    h += '<div class="card"><div class="card-hd"><div class="card-title">今日断语</div>' +
      '<div class="card-sub">依玉匣记建除 · 值宿 · 黄黑道</div></div>' +
      '<div class="verdict"><div class="vd-badge ' + r.cls + '">' + r.grade + '</div>' +
      '<div class="vd-list">' +
      '<div><b>' + r.jc + '日</b> · ' + (JC_WORD[r.jc] || JC_TXT[r.jl]) + '　<b>' + r.su.name + '</b> · ' + r.su.jx + '</div>' +
      '<div>' + '建除' + (r.huang ? '黄道' : '黑道') + '　' + (r.bai ? '<b style="color:#A62B24">百事忌</b>' : (hits.length ? '犯忌 ' + hits.length + ' 项' : '不犯诸忌')) + '</div>' +
      '</div></div>' +
      '<div class="reasons">' +
      '<div class="r"><span class="k">建除</span><span class="v">' + esc(D.jian[r.jc] || '') + '</span></div>' +
      '<div class="r"><span class="k">建除黄黑</span><span class="v">建满平收黑，除危定执黄，成开皆可用，闭破不相当 —— 此日为' +
        (r.huang ? '<span class="ok">黄道</span>' : '<span class="no">黑道</span>') +
        (CONTRA[r.jc] ? '<br><span style="color:var(--ink3)">※ ' + CONTRA[r.jc] + '</span>' : '') +
        '<br><span style="color:var(--ink3)">※ 此为玉匣记建除黄黑，与协纪「青龙、明堂……」值神黄黑道不是一回事，二者常不一致。</span></span></div>' +
      '<div class="r"><span class="k">值宿</span><span class="v">' + esc(r.su.name) + ' ' + r.su.star + '，' +
        (r.su.jx === '吉' ? '<span class="ok">吉</span>' : '<span class="no">凶</span>') + '</span></div>' +
      '<div class="r"><span class="k">诸忌</span><span class="v">' +
        (hits.length ? hits.map(function (c) { return '<span class="no">' + c.k + '</span>'; }).join('、') : '<span class="ok">无</span>') +
        '</span></div></div></div>';

    /* 建除 */
    h += '<div class="card"><div class="card-hd"><div class="card-title">建除十二星</div>' +
      '<div class="card-sub">' + r.jc + '日</div></div>' +
      '<div class="verse">' + esc(D.jian[r.jc] || '') + '</div>' +
      '<div class="hr"></div>' +
      '<div class="note"><b>百忌</b>　' + esc(D.bj[r.jc] || '') + '</div>' +
      '<div class="src">民俗吉凶日篇 · 十二建星 / 彭祖百忌日</div></div>';

    /* 二十八宿 */
    h += '<div class="card"><div class="card-hd"><div class="card-title">二十八宿值日</div>' +
      '<div class="card-sub">' + r.su.star + ' · ' + r.su.jx + '</div></div>' +
      '<div class="verse">' + esc(r.su.verse) + '</div>' +
      '<div class="src">理论吉凶日篇 · 二十八宿值日吉凶歌</div></div>';

    /* 彭祖百忌 */
    h += '<div class="card"><div class="card-hd"><div class="card-title">彭祖百忌</div>' +
      '<div class="card-sub">' + GAN[r.dgz % 10] + '日 · ' + ZHI[r.dgz % 12] + '日</div></div>' +
      '<div class="yiji-row"><div class="mark ji">忌</div><div class="yiji-txt">' +
      esc(D.bg[GAN[r.dgz % 10]] || '—') + '</div></div>' +
      '<div class="yiji-row"><div class="mark ji">忌</div><div class="yiji-txt">' +
      esc(D.bz[ZHI[r.dgz % 12]] || '—') + '</div></div>' +
      '<div class="src">民俗吉凶日篇 · 彭祖百忌日</div></div>';

    /* 诸忌检查 */
    h += '<div class="card"><div class="card-hd"><div class="card-title">诸忌日检核</div>' +
      '<div class="card-sub">共 ' + r.checks.length + ' 项</div></div>';
    r.checks.forEach(function (c) {
      h += '<div class="chk' + (c.hit ? ' hit' : '') + '"><span class="dot"></span>' +
        '<span class="nm">' + c.k + '</span>' +
        '<span class="ds">' + (c.hit ? esc(c.d) : '不犯') + '</span></div>';
    });
    h += '</div>';

    /* 六十甲子祈福 */
    var lv = r.m60.l;
    var lvTxt = lv <= -2 ? '大吉' : lv === -1 ? '吉' : lv === 0 ? '平' : lv === 2 ? '大凶' : '凶';
    var lvCls = lv <= -1 ? 'g' : lv === 0 ? 'p' : 'b';
    h += '<div class="card"><div class="card-hd"><div class="card-title">祈福吉凶</div>' +
      '<div class="card-sub">许真君玉匣记日期 · ' + r.g + '日</div></div>' +
      '<div class="verdict" style="align-items:flex-start"><div class="vd-badge ' + lvCls + '" style="width:48px;height:48px;font-size:13px">' +
      lvTxt + '</div><div class="vd-list">' + esc(r.m60.t) + '</div></div>' +
      '<div class="src">理论吉凶日篇 · 许真君《玉匣记》日期</div></div>';

    /* 人神所在 */
    h += '<div class="card"><div class="card-hd"><div class="card-title">人神所在</div>' +
      '<div class="card-sub">不宜针灸</div></div>' +
      '<div class="kv"><span class="k">' + GAN[r.dgz % 10] + '日</span><span class="v">在' + D.renshen.gan[r.dgz % 10] + '</span></div>' +
      '<div class="kv"><span class="k">' + ZHI[r.dgz % 12] + '日</span><span class="v">在' + D.renshen.zhi[r.dgz % 12] + '</span></div>' +
      '<div class="note" style="margin-top:8px">' + esc(D.renshen.note) + '</div></div>';

    h += '<div class="note" style="text-align:center;padding:16px 0 6px">玉匣记通书 · 本地版　历法内核与原站同源，吉凶体系改依《玉匣记》</div>';
    return h;
  }

  /* ---------------- 择日页 ---------------- */
  function pickHits() {
    var out = [];
    var start = jdnOf(now.getFullYear(), now.getMonth() + 1, now.getDate());
    var set = D.zeri[S.thing] || [];
    for (var i = 0; i < S.range; i++) {
      var jdn = start + i;
      var g = C.jdnToGregorian(jdn);
      var dgz = C.dayGZ(jdn), L = C.toLunar(jdn), mgz = C.monthGZ(jdn);
      if (set.indexOf(gzText(dgz)) < 0) continue;
      /* 底本按月分列者（应试赴举、分家产），只在当月为吉 */
      var mset = D.zeriM && D.zeriM[S.thing];
      if (mset && (mset[L.month - 1] || []).indexOf(gzText(dgz)) < 0) continue;
      var su = suOf(jdn);
      var jc = C.JIANCHU[C.jianchuIndex(dgz % 12, mgz.branch)];
      var cks = checks(jdn, L, dgz, mgz.branch, C.yearGZ(jdn));
      var bad = cks.filter(function (c) { return c.hit && c.w >= 2; });
      if (S.strict && bad.length) continue;
      out.push({ jdn: jdn, g: g, L: L, gz: gzText(dgz), su: su, jc: jc,
                 bad: cks.filter(function (c) { return c.hit; }) });
    }
    return out;
  }

  function viewPick() {
    if (!S.hits) S.hits = pickHits();
    var things = Object.keys(D.zeri).sort(function (a, b) { return D.zeri[b].length - D.zeri[a].length; });
    var h = '<div class="card"><div class="card-hd"><div class="card-title">择日</div>' +
      '<div class="card-sub">依玉匣记逐事吉日 · 干支查表</div></div>' +
      '<div class="field"><select id="thg">';
    things.forEach(function (t) {
      h += '<option value="' + esc(t) + '"' + (t === S.thing ? ' selected' : '') + '>' + esc(t) +
        (D.zeriM && D.zeriM[t] ? '（按月查）' : '（' + D.zeri[t].length + '日）') + '</option>';
    });
    h += '</select><select id="rng">' +
      [[60, '两个月'], [180, '半年'], [365, '一年']].map(function (x) {
        return '<option value="' + x[0] + '"' + (x[0] === S.range ? ' selected' : '') + '>' + x[1] + '</option>';
      }).join('') + '</select></div>' +
      '<label class="note" style="display:flex;gap:7px;align-items:center;margin-top:10px;cursor:pointer">' +
      '<input type="checkbox" id="strict"' + (S.strict ? ' checked' : '') + '>排除杨公忌、月忌、四离四绝、十恶大败等大忌日</label>' +
      '<button class="btn" data-act="dopick">查 吉 日</button>' +
      (D.zeriNote && D.zeriNote[S.thing] ? '<div class="note" style="margin-top:9px">※ ' + esc(D.zeriNote[S.thing]) + '</div>' : '') +
      '</div>';

    if (S.hits) {
      if (!S.hits.length) {
        h += '<div class="card"><div class="empty">所选时段内无合宜之日<br><span style="font-size:11px">可放宽排除条件或延长时间范围</span></div></div>';
      } else {
        var isM = D.zeriM && D.zeriM[S.thing];
        h += '<div class="card"><div class="card-hd"><div class="card-title">' + esc(S.thing) + '</div>' +
          '<div class="card-sub">' + S.hits.length + ' 个吉日' +
          (isM ? '　按月查表' : '') + (S.hits.length > 40 ? '　仅示前 40 日' : '') + '</div></div>';
        S.hits.slice(0, 40).forEach(function (x) {
          var wk = '周' + WEEK[new Date(x.g.year, x.g.month - 1, x.g.day).getDay()];
          h += '<div class="hit-row"><div class="hit-d"><div class="dd">' + x.g.month + '/' + x.g.day + '</div>' +
            '<div class="mm">' + esc(lunarText(x.L)) + '</div></div>' +
            '<div class="hit-m"><div class="l1">' + x.gz + '日 · ' + x.jc + '日 · ' + x.su.name +
            ' <span class="' + (x.su.jx === '吉' ? 'ok' : 'no') + '">' + x.su.jx + '</span></div>' +
            '<div class="l2">' + x.g.year + '年 ' + wk +
            (x.bad.length ? '　<span class="warn">犯 ' + x.bad.map(function (b) { return b.k; }).join('、') + '</span>' : '') +
            '</div></div></div>';
        });
        h += '</div>';
      }
    }
    h += '<div class="note" style="padding:12px 2px 4px">※ 玉匣记的择日是「某事项对应一组干支日」，故此处只按日干支比对，' +
      '再叠建除、值宿与诸忌参看。底本共 ' + Object.keys(D.zeri).length + ' 项用事。</div>';
    return h;
  }

  /* ---------------- 星宿页 ---------------- */
  function viewSu() {
    var today = suOf(jdnOf(now.getFullYear(), now.getMonth() + 1, now.getDate()));
    var h = '<div class="card"><div class="card-hd"><div class="card-title">二十八宿值日</div>' +
      '<div class="card-sub">角起，顺行二十八日一周</div></div><div class="su-grid">';
    D.su.forEach(function (x, i) {
      h += '<div class="su-cell ' + (x.jx === '吉' ? 'g' : 'b') + (x === today ? ' today' : '') +
        '" data-act="su:' + i + '"><div class="n">' + x.name.slice(0, 1) + '</div><div class="j">' + x.jx + '</div></div>';
    });
    h += '</div>';
    var o = S.suOpen === null ? D.su.findIndex(function (x) { return x === today; }) : S.suOpen;
    if (o >= 0) {
      var x = D.su[o];
      h += '<div class="su-detail"><div class="card-hd" style="margin-top:14px"><div class="card-title">' +
        x.name + '</div><div class="card-sub">' + x.star + ' · ' + x.jx + '</div></div>' +
        '<div class="verse">' + esc(x.verse) + '</div>' +
        '<div class="note" style="margin-top:8px">' + verseNotes(x) + '</div>' +
        '<div class="src">理论吉凶日篇 · 二十八宿值日吉凶歌</div></div>';
    }
    h += '<div class="src" style="text-align:left;margin-top:10px">' +
      '值宿按七元起例（虚奎毕鬼翼氐箕）推算，已用 7 个外部黄历日期校验一致。</div></div>';
    return h;
  }

  function verseNotes(x) {
    return '此宿逐事宜忌散见于歌诀之中，且底本标「' + x.jx + '」与歌诀文意时有不符' +
      '（如奎标凶而歌诀云「得祯祥、大吉昌」，毕标吉而歌诀云「造作主无光」）。' +
      '故不代作提炼，请通读全歌取用。';
  }

  /* ---------------- 八字页（子平术，非玉匣记内容） ---------------- */
  var HOURS = [['早子', '00–01'], ['丑', '01–03'], ['寅', '03–05'], ['卯', '05–07'], ['辰', '07–09'],
               ['巳', '09–11'], ['午', '11–13'], ['未', '13–15'], ['申', '15–17'], ['酉', '17–19'],
               ['戌', '19–21'], ['亥', '21–23'], ['晚子', '23–24']];
  function hourFOf(i) { return i === 0 ? 0 : (i === 12 ? 23 : 2 * i - 1); }
  function fmtHour(f) {
    var hh = Math.floor(f), mm = Math.round((f - hh) * 60);
    if (mm === 60) { hh++; mm = 0; }
    return pad(hh) + ':' + pad(mm);
  }
  var WXC = ['#3F6B4A', '#A62B24', '#9A7635', '#726A5C', '#2F4858'];

  function bzForm() {
    var st = S.bz;
    return '<div class="card bz-form">' +
      '<div class="bz-line"><span class="lab">生日</span>' +
      '<input type="number" id="bz-y" value="' + st.y + '">' +
      '<input type="number" id="bz-m" value="' + st.m + '">' +
      '<input type="number" id="bz-d" value="' + st.d + '">' +
      '</div>' +
      '<div class="bz-line"><span class="lab">时辰</span>' +
      '<select id="bz-h">' + HOURS.map(function (x, i) {
        return '<option value="' + i + '"' + (i === st.hour ? ' selected' : '') + '>' +
          x[0] + '　' + x[1] + '</option>';
      }).join('') + '</select>' +
      '<select id="bz-s"><option value="1"' + (st.male ? ' selected' : '') + '>乾造·男</option>' +
      '<option value="0"' + (!st.male ? ' selected' : '') + '>坤造·女</option></select>' +
      '</div>' +
      '<div class="bz-line"><span class="lab">经度</span>' +
      '<input type="number" id="bz-lon" step="0.1" value="' + (st.lon === '' ? '' : st.lon) +
      '" placeholder="出生地东经（如 116.4），留空按北京时">' +
      '</div>' +
      '<div class="note" style="margin-top:3px">默认取今日，请改成你出生的年月日时；时辰不确定可先选「午」</div></div>';
  }

  function bzResult() {
    var st = S.bz, B = window.BAZI;
    if (!B) return '<div class="card"><div class="card-sub">八字模块未载入</div></div>';
    var r = B.paipan({
      y: st.y, m: st.m, d: st.d, hourF: hourFOf(st.hour), male: !!st.male,
      lon: (st.lon === '' || st.lon == null) ? null : +st.lon
    });
    var out = [];

    if (r.solar.delta) {
      out.push('<div class="note" style="padding:0 13px 8px">真太阳时 ' +
        (r.solar.delta > 0 ? '+' : '') + r.solar.delta + ' 分 → ' + fmtHour(r.hourUsed) +
        '　' + r.solar.note + '</div>');
    }

    /* --- 四柱 --- */
    var ps = r.pillars;
    var p = '<div class="card"><div class="card-hd"><div class="card-title">四柱</div>' +
      '<div class="card-sub">' + r.lunar.year + '年' + (r.lunar.leap ? '闰' : '') +
      LUNAR_M[r.lunar.month - 1] + lunarDayName(r.lunar.day) + '　' + r.jie + '节后</div></div>';
    p += '<div class="ps">';
    p += '<div class="ph"></div>' + ps.map(function (x) { return '<div class="ph">' + x.label + '柱</div>'; }).join('');
    p += '<div class="rl">十神</div>' + ps.map(function (x) { return '<div class="ss">' + x.shi + '</div>'; }).join('');
    p += '<div class="rl">天干</div>' + ps.map(function (x) {
      return '<div class="big wx-' + B.GAN_WX(x.ganIdx) + '">' + x.gan + '</div>';
    }).join('');
    p += '<div class="rl">地支</div>' + ps.map(function (x) {
      return '<div class="big wx-' + B.ZHI_WX[x.zhiIdx] + '">' + x.zhi + '</div>';
    }).join('');
    p += '<div class="rl">藏干</div>' + ps.map(function (x) {
      return '<div class="cg">' + x.cang.map(function (c) {
        return c.gan + '<i style="font-style:normal;color:#B9AC97;font-size:9px">' + c.shi + '</i>';
      }).join('<br>') + '</div>';
    }).join('');
    p += '<div class="rl">纳音</div>' + ps.map(function (x) { return '<div class="ny">' + x.nayin + '</div>'; }).join('');
    p += '<div class="rl">长生</div>' + ps.map(function (x) { return '<div class="ss">' + x.cs + '</div>'; }).join('');
    p += '</div>';
    p += '<div class="note">旬空 ' + r.kong.join('') +
      (r.bz.ziLate ? '　※ 生于 23 时后，日柱已进位次日' : '') +
      (r.bz.crossTerm ? '　※ 距交节不足一日，年月柱请核对交节时刻' : '') + '</div></div>';
    out.push(p);

    /* --- 五行与旺衰 --- */
    var mx = Math.max.apply(null, r.wx.counts) || 1;
    var w = '<div class="card"><div class="card-hd"><div class="card-title">五行</div>' +
      '<div class="card-sub">' + (r.wx.unclear ? '强弱难定' : r.wx.strengthText) + '　同类占比 ' +
      Math.round(r.wx.ratio * 100) + '%</div></div>';
    r.wx.counts.forEach(function (v, i) {
      w += '<div class="wxrow"><span class="n wx-' + i + '">' + B.WX_NAME[i] + '</span>' +
        '<div class="bar"><i style="width:' + Math.round(v / mx * 100) + '%;background:' + WXC[i] + '"></i></div>' +
        '<span class="v">' + v.toFixed(1) + '</span></div>';
    });
    w += '<div class="note">得令 ' + (r.wx.deLing ? '是' : '否') + '　得地 ' + r.wx.deDi +
      ' 处　得势 ' + r.wx.deShi + ' 干</div>';
    w += '<div class="note" style="margin-top:3px">喜 <b>' + r.wx.favText + '</b>　忌 ' + r.wx.unfText + '</div>';
    out.push(w + '</div>');

    /* --- 格局 --- */
    var g = '<div class="card"><div class="card-hd"><div class="card-title">格局</div>' +
      '<div class="card-sub">' + r.gj.name + '　' + r.gj.by + '</div></div>' +
      '<div class="note"><b>' + r.gjStatus.verdict + '</b>　' + r.gjStatus.reasons.join('；') + '</div>';
    if (r.yong) g += '<div class="note" style="margin-top:3px">取用 ' + r.yong.shi + '（' + r.yong.by + '）</div>';
    if (r.gjStatus.bing) g += '<div class="note" style="margin-top:3px">病 ' + r.gjStatus.bing +
      '　药 ' + r.gjStatus.yao + '（' + r.gjStatus.yaoBy + '）</div>';
    out.push(g + '</div>');

    /* --- 调候 --- */
    var t = '<div class="card"><div class="card-hd"><div class="card-title">调候</div>' +
      '<div class="card-sub">' + (r.tiaohou ? r.tiaohou.sec + '　' + r.tiaohou.juan : '底表未收此格') + '</div></div>';
    if (r.tiaohou) {
      var wxo = function (g) { return B.WX_NAME[[0, 0, 1, 1, 2, 2, 3, 3, 4, 4][B.GAN.indexOf(g)]]; };
      var use = r.tiaohou.gans || [];
      if (use.length) {
        t += '<div class="note">主用 <b>' + use[0] + wxo(use[0]) + '</b>' +
          (use[1] ? '　次用 <b>' + use[1] + wxo(use[1]) + '</b>' : '') + '</div>';
      } else {
        t += '<div class="note">原文此格未明标用神，不代拟。</div>';
      }
      t += '<div class="verse">' + esc(r.tiaohou.text) + '</div>';
    } else {
      t += '<div class="note">《穷通宝鉴》逐月调候表缺此格（表共 113 条，十干十二月应为 120 条），' +
        '故不列调候，非无此格。</div>';
    }
    out.push(t + '</div>');

    /* --- 神煞 --- */
    var sh = '<div class="card"><div class="card-hd"><div class="card-title">神煞</div></div><div class="ssh">' +
      (r.shensha.length ? r.shensha.map(function (x) {
        return '<span>' + x.n + '·' + x.pos + '</span>';
      }).join('') : '<span style="border:none;background:none;color:var(--ink3)">无</span>') + '</div>';
    if (r.rel.length) {
      sh += '<div class="note" style="margin-top:10px;color:var(--ink3)">刑冲合害</div>' +
        '<div class="note" style="margin-top:2px">' + r.rel.map(function (x) { return x.t; }).join('　') + '</div>';
    }
    out.push(sh + '</div>');

    /* --- 大运 --- */
    var dy = r.dayun;
    var d = '<div class="card"><div class="card-hd"><div class="card-title">大运</div>' +
      '<div class="card-sub">' + (dy.forward ? '顺行' : '逆行') + '　' + dy.q.text + '</div></div>' +
      '<div class="note">距' + dy.q.jie + ' ' + dy.q.days + ' 日，三日折一岁</div><div class="dys">';
    d += dy.list.map(function (x) {
      var sc = B.yunScore(x.gan, x.zhi, r.bz, r.wx.fav, r.wx.unf);
      var cl = sc.score >= 62 ? 'ok' : (sc.score <= 38 ? 'no' : '');
      return '<div class="dy"><b class="wx-' + B.GAN_WX(x.gan) + '">' + x.text + '</b>' +
        '<span class="a">' + x.from + '–' + x.to + ' 岁</span>' +
        '<span class="a">' + x.yearFrom + ' 年起</span>' +
        '<span class="s ' + cl + '">' + sc.score + ' ' + sc.stage + '</span></div>';
    }).join('');
    out.push(d + '</div></div>');

    /* --- 流年 --- */
    var ln = '<div class="card"><div class="card-hd"><div class="card-title">流年</div>' +
      '<div class="card-sub">' + now.getFullYear() + ' 起十二年</div></div><div class="lns">';
    for (var yy = now.getFullYear(); yy < now.getFullYear() + 12; yy++) {
      var L2 = B.liuNian(yy);
      var sc2 = B.yunScore(L2.gan, L2.zhi, r.bz, r.wx.fav, r.wx.unf);
      var c2 = sc2.score >= 62 ? 'ok' : (sc2.score <= 38 ? 'no' : '');
      ln += '<div class="ln"><span>' + yy + '</span><b class="wx-' + B.GAN_WX(L2.gan) + '">' + L2.text + '</b>' +
        '<span class="' + c2 + '">' + B.shiShen(r.bz.dayMaster, L2.gan) + ' ' + sc2.score + '</span></div>';
    }
    out.push(ln + '</div></div>');

    /* --- 今日对命局：把日黄历接回八字 --- */
    var j0 = C.gregorianToJDN(now.getFullYear(), now.getMonth() + 1, now.getDate());
    var dgz0 = C.dayGZ(j0);
    var dr = B.dayRelations(dgz0 % 10, dgz0 % 12, r.bz);
    var sc3 = B.yunScore(dgz0 % 10, dgz0 % 12, r.bz, r.wx.fav, r.wx.unf);
    var tz = '<div class="card"><div class="card-hd"><div class="card-title">今日对命局</div>' +
      '<div class="card-sub">' + gzText(dgz0) + '日　' + B.shiShen(r.bz.dayMaster, dgz0 % 10) +
      '　' + sc3.score + ' 分</div></div>' +
      '<div class="note">' + (dr.list.length
        ? dr.list.map(function (x) { return x.text; }).join('　')
        : '与四柱无冲合刑害') + '</div>';
    if (dr.kongHit.length) tz += '<div class="note" style="margin-top:3px">日支落旬空：' + dr.kongHit.join('、') + '柱</div>';
    out.push(tz + '</div>');

    /* --- 声明 --- */
    out.push('<div class="card"><div class="note">本页是<b>子平术排盘</b>，<b>非《玉匣记》内容</b>——' +
      '玉匣记全书二百六十五节，无四柱排盘法、大运、十神、取格之说（仅有一句「寅申巳亥为四柱日」，' +
      '那是择日术语）。故本页与玉匣记并列而非其一部分。四柱与十神依《渊海子平》，调候依《穷通宝鉴》，' +
      '十二长生依十干生旺死绝表，纳音依六十甲子纳音。格局成败、大运流年分数为程序按通行法推定，' +
      '只作参考，不作命理断语。</div></div>');

    return out.join('');
  }

  function viewBazi() {
    return bzForm() + '<div id="bz-out">' + bzResult() + '</div>';
  }

  /* ---------------- 体例页 ---------------- */
  function viewAbout() {
    return '<div class="card"><div class="card-hd"><div class="card-title">这是什么</div></div>' +
      '<div class="note">本页是「<b>玉匣记版</b>」黄历，与原站（<b>协纪黄历</b>）并列的另一个版本。' +
      '历法内核（农历、干支、节气、建除）与原站同源、已校验；但<b>吉凶体系整换</b>——' +
      '日子的断语不再取《协纪辨方书》卷十月表六等，而全部依《玉匣记》。</div>' +
      '<div class="warnbox">两套体系对同一天可能给出不同结论，这是正常的，不是谁算错了。' +
      '协纪是清代官修的选择书，玉匣记是民间通书，判法本就不同。</div></div>' +

      '<div class="card"><div class="card-hd"><div class="card-title">取用规则</div></div>' +
      '<div class="kv"><span class="k">建除</span><span class="v">十二建星断语，吉凶依本书「平、成、开、危最吉；定、除次吉；破大凶」</span></div>' +
      '<div class="kv"><span class="k">建除黄黑</span><span class="v">建满平收黑，除危定执黄，成开皆可用，闭破不相当（与协纪值神黄黑道不同）</span></div>' +
      '<div class="kv"><span class="k">值宿</span><span class="v">二十八宿值日吉凶歌，逐日顺推</span></div>' +
      '<div class="kv"><span class="k">忌日</span><span class="v">杨公忌、月忌、四离四绝、十恶大败、四不详、长短星、探病、神号鬼哭</span></div>' +
      '<div class="kv"><span class="k">祈福</span><span class="v">许真君《玉匣记》日期（六十甲子逐日诸神所在）</span></div>' +
      '<div class="kv"><span class="k">择日</span><span class="v">逐事吉日，按日干支查表，再叠建除与诸忌；应试赴举、分家产、斩草破土三项底本按月分列，按月查</span></div></div>' +

      '<div class="card"><div class="card-hd"><div class="card-title">已知问题</div></div>' +
      '<div class="note">' +
      '① <b>二十八宿的吉凶标签与歌诀有矛盾</b>：奎标凶而歌诀作「得祯祥、大吉昌」，星标凶而歌诀作「好造新房、进职加官」，' +
      '毕标吉而歌诀作「造作主无光」。此处照录底本，未擅改，断事请以歌诀为准。<br>' +
      '② 底本二十八宿歌以「箕」列「尾」之前，与通行宿序（角亢氐房心尾箕）不合，已换回正序，歌诀随宿未改一字。<br>' +
      '③ <b>杨公忌「六月初二」破等差</b>（全表 13/11/9/7/5/3/1），本站从通行本作<b>初三</b>。<br>' +
      '④ 十恶大败的「月」按<b>月建（节气月）</b>取，非农历月。本节标题作「十恶大败日」，标题下首行即注「百事忌」，' +
      '附歌诀又自释「何谓十恶大败？乃十干无禄」，是甲辰、乙巳、壬申、丙申、丁亥、庚辰、戊戌、癸亥、辛巳、己丑十日即十恶大败本身；' +
      '年干表所列诸日尽在此十位之内，表末又自注「此是年干大败」，明言此表只是年干一种、非十恶大败之全，' +
      '故二表合为一项，十日皆判百事忌，不重复计罚，' +
      '年干与月建相合者另注出处。另有一说，以「百事忌」三字只辖其下年干表、歌诀仅为附录，则十日单值者不全判忌；' +
      '本书既以「十恶大败日」名节、又以歌诀自释其义，故不取其说，仍从严。<br>' +
      '⑤ 人神所在「逐日」一表底本残缺（至十一日而断），故只列逐干、逐支、逐时三表。<br>' +
      '⑥ 本书十二建星一段有「如子年，子上起建」之语，那是论山向方位的岁建，非逐日建除；' +
      '逐日仍以<b>月建</b>起建，与通书同。<br>' +
      '⑦ 综合断语中的权重（宿、建除、黄黑、忌日）为本站自定，非原书所有。<br>' +
      '⑧ 杨公忌、月忌、十恶大败，本书明标<b>「百事忌」</b>，故一旦命中即判大凶，不因建除、值宿之吉而减。' +
      '四不详、长短星、探病、神号鬼哭属单项忌讳，只列不评。<br>' +
      '⑨ 底本「建：为太岁，可言可凶」，「言」当为「吉」之形讹，已正作「可吉可凶」。<br>' +
      '⑩ 底本繁体转简体时「己／已／巳」「未／末」「丑／醜」互讹，择日表已按干支校正：' +
      '纳奴婢「已末」作己未、买田地「癸末」作癸未、造酒「已末」作己未、纳犬「辛已」「乙末」作辛巳乙未、' +
      '入宅移居「壬成」作壬戌、上梁「乙己」作乙巳、入山伐木「王午」作壬午。' +
      '不成干支而又无可确指者（盖屋「乙癸」、纳猫「乙辰」、买鸡鹅鸭「甲亥」、纳犬「壬癸」）不补，逐项注于择日页。<br>' +
      '⑪ 底本择日凡有干支表者皆已录入（含附表作马枋、作牛栏、出蚕）；' +
      '「收蜂割蜜」「畋猎网鱼」「抱鸡鹅鸭」「修猪圈」诸条只列宜忌条件、无干支表，故不入择日表。</div></div>' +

      '<div class="card"><div class="card-hd"><div class="card-title">八字页不是玉匣记</div></div>' +
      '<div class="note">玉匣记全书二百六十五节，<b>没有四柱排盘法</b>，只有一句「又宜寅、申、巳亥为四柱日」——' +
      '那是择日里说日课四柱，不是排八字。所以「八字」页是<b>另立的一页子平术</b>，与玉匣记并列，不是它的一部分。<br>' +
      '其来源：四柱、五鼠遁、十神、取格依《渊海子平》；调候依《穷通宝鉴》逐月条文；十二长生依十干生旺死绝表；' +
      '纳音依六十甲子纳音。<br>' +
      '起运按「三日折一岁」，从出生时刻算到最近一个节，年柱以立春、月柱以节为界，<b>均比较到分钟</b>，不比到日。<br>' +
      '格局成败（成／破／平）与大运流年分数是程序按通行法推的，<b>只作参考，不作命理断语</b>。</div></div>' +

      '<div class="card"><div class="card-hd"><div class="card-title">数据来源</div></div>' +
      '<div class="note">底本：维基文库《玉匣记》（zh.wikisource.org），265 节，已转简体并校订。<br>' +
      '值宿起例：七元「虚奎毕鬼翼氐箕」，以 1949-10-01（甲子）为锚。' +
      '经 2012-01-01 房、2019-01-27 虚、2026-02-19 奎、04-20 毕、06-19 鬼、08-18 翼、11-20 牛 七例外部黄历校验，全合。<br>' +
      '历法：定朔定气，北京时间 UTC+8，年柱以立春、月柱以节为界。</div>' +
      '<div class="src">本地文件 · 离线可用</div></div>';
  }

  /* ---------------- 路由 ---------------- */
  function render() {
    var v = document.getElementById('view');
    if (S.tab === 'day') v.innerHTML = viewDay();
    else if (S.tab === 'pick') v.innerHTML = viewPick();
    else if (S.tab === 'su') v.innerHTML = viewSu();
    else if (S.tab === 'bazi') v.innerHTML = viewBazi();
    else v.innerHTML = viewAbout();
    v.scrollTop = 0;

    var dp = document.getElementById('dpick');
    if (dp) dp.addEventListener('change', function () {
      var p = this.value.split('-');
      if (p.length === 3) { S.y = +p[0]; S.m = +p[1]; S.d = +p[2]; render(); }
    });
    var thg = document.getElementById('thg');
    if (thg) thg.addEventListener('change', function () { S.thing = this.value; S.hits = null; render(); });
    var rng = document.getElementById('rng');
    if (rng) rng.addEventListener('change', function () { S.range = +this.value; S.hits = null; render(); });
    var st = document.getElementById('strict');
    if (st) st.addEventListener('change', function () { S.strict = this.checked ? 1 : 0; S.hits = null; render(); });

    /* 八字：只重绘结果区，避免输入时失焦 */
    var by = document.getElementById('bz-y');
    if (by) {
      var syncBz = function () {
        var yy = parseInt(by.value, 10), mm = parseInt(document.getElementById('bz-m').value, 10),
            dd = parseInt(document.getElementById('bz-d').value, 10);
        if (!(yy >= 1800 && yy <= 2200) || !(mm >= 1 && mm <= 12) || !(dd >= 1 && dd <= 31)) return;
        var dt = new Date(yy, mm - 1, dd);
        if (dt.getMonth() !== mm - 1 || dt.getDate() !== dd) return;
        S.bz.y = yy; S.bz.m = mm; S.bz.d = dd;
        var lv = document.getElementById('bz-lon').value;
        S.bz.lon = (lv === '' || isNaN(parseFloat(lv))) ? '' : parseFloat(lv);
        var o = document.getElementById('bz-out');
        if (o) o.innerHTML = bzResult();
      };
      ['bz-y', 'bz-m', 'bz-d', 'bz-lon'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.addEventListener('change', syncBz);
      });
      var bzh = document.getElementById('bz-h');
      if (bzh) bzh.addEventListener('change', function () { S.bz.hour = +this.value; syncBz(); });
      var bzs = document.getElementById('bz-s');
      if (bzs) bzs.addEventListener('change', function () { S.bz.male = +this.value; syncBz(); });
    }
  }

  function shiftDay(n) {
    var dt = new Date(S.y, S.m - 1, S.d + n);
    S.y = dt.getFullYear(); S.m = dt.getMonth() + 1; S.d = dt.getDate(); render();
  }

  /* 深链：#pick / #su / #about */
  var _h = (location.hash || '').replace('#', '');
  if (['pick', 'su', 'bazi', 'about'].indexOf(_h) >= 0) S.tab = _h;

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act],[data-tab]');
    if (!t) return;
    var tab = t.getAttribute('data-tab');
    if (tab) {
      S.tab = tab; try { location.hash = tab === 'day' ? '' : tab; } catch (e) {}
      Array.prototype.forEach.call(document.querySelectorAll('.tabbar button'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-tab') === S.tab);
      });
      render(); return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'prev') shiftDay(-1);
    else if (act === 'next') shiftDay(1);
    else if (act === 'dopick') { S.hits = pickHits(); render(); }
    else if (act.indexOf('su:') === 0) { S.suOpen = +act.slice(3); render(); }
  });

  window.__YXJ = { buildDay: buildDay, pickHits: pickHits, suOf: suOf, checks: checks, bzResult: bzResult, S: S };
  render();
})();

</script>
</body>
</html>
